<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0077B6">
  <title>Profile Settings — e-Gabay PWD</title>
  <script>
    if (location.protocol === 'file:') {
      location.replace('http://localhost/e_Gabay_System/profile-settings.html');
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="portal-page profile-page profile-settings-page">
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand brand-lockup" id="profile-home" href="pwd.html" aria-label="Return to your portal">
          <span class="brand-mark" aria-hidden="true">e</span>
          <span class="brand-text">e-Gabay <span>PWD</span><small>MARINDUQUE</small></span>
        </a>
        <div class="profile-page-nav">
          <a class="text-link" id="back-profile" href="profile.html">My profile</a>
          <a class="text-link" id="back-portal" href="pwd.html">Back to portal</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="container portal-main" id="main-content">
    <div class="profile-page-heading">
      <div class="eyebrow"><span class="eyebrow-line"></span> ACCOUNT MANAGEMENT</div>
      <h1>Profile <span>settings</span></h1>
      <p class="portal-intro">Update your personal information, profile picture, and password.</p>
      <a class="btn btn-outline-primary" href="profile.html">← Back to my profile</a>
    </div>
    <div class="row g-4 profile-settings-grid">
      <div class="col-xl-8">
        <section class="portal-card" aria-labelledby="personal-heading">
          <h2 class="h4" id="personal-heading">Personal information</h2>
          <form id="profile-form">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="pr-name">Complete name</label><input class="form-control" id="pr-name" name="name" autocomplete="name" maxlength="150" required></div>
              <div class="col-md-6"><label class="form-label" for="pr-email">Email address</label><input class="form-control" id="pr-email" name="email" type="email" autocomplete="email" required></div>
              <div class="col-md-6"><label class="form-label" for="pr-contact_number">Contact number</label><input class="form-control" id="pr-contact_number" name="contact_number" type="tel" autocomplete="tel"></div>
              <div class="col-md-6"><label class="form-label" for="pr-birth_date">Date of birth</label><input class="form-control" id="pr-birth_date" name="birth_date" type="date"></div>
              <div class="col-md-6"><label class="form-label" for="pr-age">Age (calculated)</label><input class="form-control" id="pr-age" readonly></div>
              <div class="col-md-6"><label class="form-label" for="pr-sex">Sex</label><select class="form-select" id="pr-sex" name="sex"><option value="">Not specified</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></div>
              <div class="col-12"><label class="form-label" for="pr-address_line">Complete address</label><input class="form-control" id="pr-address_line" name="address_line" maxlength="255"></div>
              <div class="col-md-6"><label class="form-label" for="pr-municipality">Municipality</label><select class="form-select" id="pr-municipality" name="municipality"><option value="">Not specified</option><option>Boac</option><option>Mogpog</option><option>Gasan</option><option>Buenavista</option><option>Santa Cruz</option><option>Torrijos</option></select></div>
              <div class="col-md-6"><label class="form-label" for="pr-barangay">Barangay</label><input class="form-control" id="pr-barangay" name="barangay" maxlength="120"></div>
              <div class="col-md-6"><label class="form-label" for="pr-pwd_id_number">PWD ID number</label><input class="form-control" id="pr-pwd_id_number" name="pwd_id_number" maxlength="80"></div>
              <div class="col-md-6"><label class="form-label" for="pr-disability_type">Type of disability</label><input class="form-control" id="pr-disability_type" name="disability_type" maxlength="150"></div>
              <div class="col-md-6"><label class="form-label" for="pr-id_valid_until">PWD ID expiration date</label><input class="form-control" id="pr-id_valid_until" name="id_valid_until" type="date"></div>
              <div class="col-12"><button class="btn btn-primary" type="submit">Save personal details</button><p class="form-feedback" id="profile-feedback" role="status" aria-live="polite"></p></div>
            </div>
          </form>
        </section>
      </div>
      <div class="col-xl-4">
        <section class="portal-card mb-4">
          <h2 class="h5">Profile picture</h2>
          <img id="profile-photo" class="profile-photo" alt="Your profile picture" hidden>
          <form id="picture-form">
            <label class="form-label" for="picture-file">JPG, PNG or WEBP, up to 2 MB</label>
            <input class="form-control" id="picture-file" name="picture" type="file" accept="image/jpeg,image/png,image/webp" required>
            <button class="btn btn-primary mt-3" type="submit">Upload photo</button>
            <p id="picture-feedback" class="form-feedback" role="status" aria-live="polite"></p>
          </form>
        </section>
        <section class="portal-card">
          <h2 class="h5">Change password</h2>
          <form id="password-form">
            <label class="form-label" for="current-password">Current password</label>
            <input class="form-control mb-3" id="current-password" type="password" autocomplete="current-password" required>
            <label class="form-label" for="new-password">New password (8+ characters)</label>
            <input class="form-control mb-3" id="new-password" type="password" autocomplete="new-password" minlength="8" required>
            <button class="btn btn-primary" type="submit">Change password</button>
            <p class="form-feedback" id="password-feedback" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </div>
  </main>
  <script src="assets/js/profile-settings.js?v=2"></script>
</body>
</html>
